<!DOCTYPE html>
<html lang="uk">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>PyCode Hub - Інтерактивне вивчення Python</title>
    
    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Fira+Code:wght@400;500;600&family=Inter:wght@300;400;500;600;700&family=Outfit:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    
    <!-- CodeMirror 5 CDN -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.12/codemirror.min.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.12/theme/eclipse.min.css">
    
    <!-- Custom CSS -->
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <!-- Confetti canvas for celebrations -->
    <canvas id="confetti-canvas"></canvas>

    <!-- Hint Modal -->
    <div id="hint-modal" class="modal-overlay">
        <div class="modal-card">
            <div class="modal-header">
                <h3>💡 Підказки до уроку</h3>
                <span id="hint-counter" class="hint-counter-badge"></span>
                <button id="close-hint-btn" class="modal-close-btn">&times;</button>
            </div>
            <div class="modal-body" id="hint-modal-body">
                <!-- Hint text injected dynamically -->
            </div>
            <div class="modal-footer hint-footer">
                <button id="prev-hint-btn" class="btn btn-secondary btn-sm">← Назад</button>
                <div class="hint-footer-right">
                    <button id="next-hint-btn" class="btn btn-primary btn-sm">Наступна підказка →</button>
                    <button id="close-hint-footer-btn" class="btn btn-success btn-sm">Зрозуміло!</button>
                </div>
            </div>
        </div>
    </div>

    <!-- Handbook Drawer -->
    <div id="handbook-drawer" class="drawer-overlay">
        <div class="drawer-content">
            <div class="drawer-header">
                <h2>📖 Довідник Python</h2>
                <button id="close-handbook-btn" class="drawer-close-btn">&times;</button>
            </div>
            <div class="drawer-tabs">
                <button class="tab-btn active" data-tab="variables">📦 Змінні & Типи</button>
                <button class="tab-btn" data-tab="math">🧮 Математика</button>
                <button class="tab-btn" data-tab="logic">🛡️ Логіка & Умови</button>
                <button class="tab-btn" data-tab="loops">🔄 Цикли</button>
            </div>
            <div class="drawer-body scrollable" id="handbook-body">
                <!-- Handbook text loads dynamically -->
            </div>
        </div>
    </div>

    <div class="app-container">
        <!-- Top Navbar -->
        <header class="navbar">
            <div class="logo">
                <span class="logo-icon">🐍</span>
                <span class="logo-text">PyCode Hub</span>
            </div>
            
            <div class="progress-container">
                <span class="progress-title">Твій прогрес:</span>
                <div class="progress-steps" id="progress-steps">
                    <!-- Steps will be generated by JS -->
                </div>
            </div>
            
            <div class="navbar-right">
                <!-- Handbook trigger button -->
                <button id="handbook-btn" class="btn btn-secondary btn-sm btn-handbook" title="Відкрити довідник з Python">
                    <span>📖 Довідник Python</span>
                </button>
                
                <div class="theme-switcher">
                    <span class="theme-label" title="Змінити колір акценту">🎨</span>
                    <div class="accent-colors">
                        <button class="accent-dot active" data-color="indigo" style="background-color: #6366f1;" title="Індиго"></button>
                        <button class="accent-dot" data-color="emerald" style="background-color: #10b981;" title="Смарагд"></button>
                        <button class="accent-dot" data-color="rose" style="background-color: #f43f5e;" title="Троянда"></button>
                        <button class="accent-dot" data-color="amber" style="background-color: #f59e0b;" title="Бурштин"></button>
                        <button class="accent-dot" data-color="cyan" style="background-color: #06b6d4;" title="Ціан"></button>
                    </div>
                </div>
                
                <div class="user-stats">
                    <span id="level-badge" class="badge badge-indigo">Рівень: Вступ</span>
                </div>
            </div>
        </header>

        <!-- Main Workspace Grid -->
        <main class="workspace">
            
            <!-- LEFT PANEL: Theory & Instructions (40% width) -->
            <section class="panel panel-left theory-panel">
                <div class="panel-header">
                    <h2>📚 Навчальний матеріал</h2>
                    <span id="lesson-indicator" class="badge badge-blue">Урок 1/9</span>
                </div>
                
                <div class="panel-body scrollable" id="theory-content">
                    <!-- Theory content will be dynamically loaded here -->
                </div>
            </section>

            <!-- RIGHT PANEL: IDE & Terminal (60% width) -->
            <section class="panel panel-right interactive-panel">
                
                <!-- IDE Section -->
                <div class="ide-container">
                    <div class="ide-header">
                        <div class="file-name">
                            <span class="file-icon">📄</span>
                            <span>main.py</span>
                        </div>
                        <div class="editor-actions">
                            <button id="reset-btn" class="btn btn-secondary btn-sm" title="Скинути код до початкового стану">
                                <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M21.5 2v6h-6M21.34 15.57a10 10 0 1 1-.57-8.38l5.67-5.67"/></svg>
                                <span>Скинути</span>
                            </button>
                        </div>
                    </div>
                    
                    <!-- Editor Textarea (replaced by CodeMirror) -->
                    <div class="editor-wrapper">
                        <textarea id="code-textarea"></textarea>
                    </div>

                    <!-- Button Control Bar -->
                    <div class="control-bar">
                        <div class="control-left">
                            <button id="run-btn" class="btn btn-success">
                                <svg class="icon-play" width="18" height="18" viewBox="0 0 24 24" fill="currentColor"><polygon points="5 3 19 12 5 21 5 3"/></svg>
                                <span>Запустити код</span>
                            </button>
                            
                            <button id="show-hint-btn" class="btn btn-secondary" title="Показати підказку до уроку">
                                <span>💡 Підказка</span>
                            </button>
                        </div>
                        
                        <button id="next-btn" class="btn btn-primary" disabled>
                            <span>Наступний урок</span>
                            <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><line x1="5" y1="12" x2="19" y2="12"/><polyline points="12 5 19 12 12 19"/></svg>
                        </button>
                    </div>
                </div>

                <!-- Terminal Section -->
                <div class="terminal-container">
                    <div class="panel-header terminal-header">
                        <div class="window-dots">
                            <span class="dot dot-red"></span>
                            <span class="dot dot-yellow"></span>
                            <span class="dot dot-green"></span>
                        </div>
                        <div class="terminal-title">Термінал виводу</div>
                        <button id="clear-terminal-btn" class="btn-clear-terminal" title="Очистити консоль">Очистити</button>
                    </div>
                    <div class="terminal-body scrollable" id="terminal-body">
                        <div class="terminal-welcome">Ласкаво просимо до PyCode Hub terminal. Результат вашого коду з'явиться тут...</div>
                    </div>
                </div>

            </section>
        </main>
    </div>

    <!-- CodeMirror JS CDN -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.12/codemirror.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.12/mode/python/python.min.js"></script>
    
    <!-- Skulpt JS CDN -->
    <script src="https://cdn.jsdelivr.net/npm/skulpt@1.2.0/dist/skulpt.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/skulpt@1.2.0/dist/skulpt-stdlib.js"></script>
    
    <!-- Custom JS Application -->
    <script src="app.js"></script>
</body>
</html>
